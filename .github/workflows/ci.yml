# CI: runs on every push and pull request (and is reused by the release pipeline).
# Type check → unit tests (incl. two-device sync simulation) → production build → end-to-end tests on iPhone (WebKit) and Android (Chromium).
name: CI

on:
  pull_request:
  push:
    branches-ignore: [main, develop]
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: ${{ hashFiles('package-lock.json') != '' && 'npm' || '' }}

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi

      - name: Upload lockfile (first run only)
        if: hashFiles('package-lock.json') == ''
        uses: actions/upload-artifact@v4
        with:
          name: package-lock
          path: package-lock.json

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Install browsers
        run: npx playwright install --with-deps chromium webkit

      - name: End-to-end tests (local build)
        run: npx playwright test --grep "@local|@smoke"

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-ci
          path: |
            playwright-report
            test-results
          retention-days: 14
